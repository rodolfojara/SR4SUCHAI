name: C build and core tests

on:
  push:
    branches:
      - rewrite/robust-from-matlab
  pull_request:
    branches:
      - master

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile production modules
        run: |
          gcc -std=c99 -Wall -Wextra -Wpedantic -Werror -Isrc -c \
            src/image.c \
            src/GradientRegulization.c \
            src/GradientBackProject.c \
            src/FastGradientBackProject.c \
            src/MedianAndShift.c \
            src/RobustSR.c \
            src/FastRobustSR.c
      - name: Build core tests
        run: |
          gcc -std=c99 -Wall -Wextra -Wpedantic -Werror -Isrc \
            tests/test_core.c src/image.c src/GradientRegulization.c \
            src/GradientBackProject.c src/FastGradientBackProject.c \
            src/MedianAndShift.c -lm -o test_core
      - name: Run core tests
        run: ./test_core
